[package]
name = "linux-system-explorer"
version = "0.1.0-alpha.5"
edition = "2024"
rust-version = "1.95"
description = "Um explorador de arquivos para Linux inspirado no Windows Explorer"
license = "MIT"
authors = ["Jander Tavares"]
repository = "https://github.com/janderpt/linux-system-explorer"
homepage = "https://github.com/janderpt/linux-system-explorer"
readme = "README.md"

[package.metadata.distribution]
maintainer = "Jander Tavares <jander@sonner.com.br>"
channel = "experimental"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uzers = "0.12"
rustix = { version = "1", features = ["fs", "process"] }
trash = "5.3"
freedesktop-desktop-entry = { version = "0.8.4", default-features = false }
guth-wayland-dnd = "0.3.1"
raw-window-handle = "0.6"
x11rb = { version = "0.13", features = ["shape"] }
url = "2"
percent-encoding = "2"
libloading = "0.8.9"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
resvg = { version = "0.49.0", default-features = false, features = ["text", "raster-images"] }
roxmltree = "0.21.2"
tiff = "0.11.3"
# Current upstream API, with a narrowly scoped Flatpak authentication backport.
# See vendor/zbus/README.lse.md and packaging/patches/zbus-flatpak-auth.patch.
zbus = "=6.2.1"
wayland-client = { version = "0.31.15", features = ["system"] }
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
portable-pty = "0.9.0"
vt100 = "0.18.1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[profile.release]
lto = "thin"
strip = true

[build-dependencies]
resvg = { version = "0.49.0", default-features = false }


[patch.crates-io]
zbus = { path = "vendor/zbus" }
