name: Publish alpha prerelease

on:
  push:
    tags:
      - 'v*-alpha.*'

permissions:
  contents: read

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os,re,tomllib
          version=tomllib.load(open('Cargo.toml','rb'))['package']['version']
          tag=os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v\d+\.\d+\.\d+-alpha\.\d+',tag) and tag=='v'+version
          PY
      - name: Install build, test and preview runtimes
        timeout-minutes: 15
        run: sudo env GITHUB_ACTIONS=true python3 scripts/ci-dependencies.py libxkbcommon-dev libwayland-dev dpkg-dev desktop-file-utils appstream dbus-daemon poppler-utils libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav ffmpeg libreoffice-writer libreoffice-calc libreoffice-impress libreoffice-draw libreoffice-math fonts-liberation weasyprint libarchive13t64
      - name: Fetch locked dependency sources
        run: cargo fetch --locked
      - name: Check source
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          python3 scripts/package.py check
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Audit locked crates
        run: |
          curl --fail --location --retry 3 https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.23.0/cargo-audit-x86_64-unknown-linux-musl-v0.23.0.tgz -o "$RUNNER_TEMP/cargo-audit.tgz"
          echo "4f01c74ed84b2dffd0b1d37012a62cdf2a92c96e25bdf8eec7fcc0d4d3eb7811  $RUNNER_TEMP/cargo-audit.tgz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/audit" dist
          tar -xzf "$RUNNER_TEMP/cargo-audit.tgz" -C "$RUNNER_TEMP/audit" --strip-components=1 cargo-audit-x86_64-unknown-linux-musl-v0.23.0/cargo-audit
          "$RUNNER_TEMP/audit/cargo-audit" audit --json > dist/RUSTSEC-AUDIT.json
      - name: Build release packages
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          cargo build --locked --release
          python3 scripts/package.py build
          python3 scripts/finalize-prerelease.py dist "$RELEASE_TAG"
      - name: Test packages in a clean Ubuntu container
        timeout-minutes: 15
        run: |
          docker run --rm -v "$PWD/dist:/packages:ro" -v "$PWD/scripts/smoke-packages.sh:/smoke.sh:ro" ubuntu:24.04 sh /smoke.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-alpha-assets
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-alpha-assets
          path: dist
      - name: Publish the validated prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --prerelease --title "Linux System Explorer $RELEASE_TAG" --notes-file INSTALL.md ./*
